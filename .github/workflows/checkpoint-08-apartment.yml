name: Checkpoint 08 · apartment service

# Pipeline of the apartment team. It runs when the apartment service, the shared
# platform code it builds on, or the event contract it publishes changes.
on:
  push:
    branches: [main]
    paths:
      - 'releases/checkpoint-08-microservices/microservices/dimora/apartment/**'
      - 'releases/checkpoint-08-microservices/microservices/dimora/common/**'
      - 'releases/checkpoint-08-microservices/microservices/contracts/**'
      - 'releases/checkpoint-08-microservices/microservices/tests/unit/test_apartment*'
      - 'releases/checkpoint-08-microservices/microservices/tests/contract/test_apartment*'
      - 'releases/checkpoint-08-microservices/microservices/requirements.txt'
      - 'releases/checkpoint-08-microservices/microservices/Dockerfile'
      - 'releases/checkpoint-08-microservices/apartment_booking/**'
      - '.github/workflows/checkpoint-08-apartment.yml'
      - '.github/workflows/checkpoint-08-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'releases/checkpoint-08-microservices/microservices/dimora/apartment/**'
      - 'releases/checkpoint-08-microservices/microservices/dimora/common/**'
      - 'releases/checkpoint-08-microservices/microservices/contracts/**'
      - 'releases/checkpoint-08-microservices/microservices/tests/unit/test_apartment*'
      - 'releases/checkpoint-08-microservices/microservices/tests/contract/test_apartment*'
      - 'releases/checkpoint-08-microservices/microservices/requirements.txt'
      - 'releases/checkpoint-08-microservices/microservices/Dockerfile'
      - 'releases/checkpoint-08-microservices/apartment_booking/**'
      - '.github/workflows/checkpoint-08-apartment.yml'
      - '.github/workflows/checkpoint-08-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-08-apartment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apartment:
    uses: ./.github/workflows/checkpoint-08-service.yml
    with:
      service: apartment
