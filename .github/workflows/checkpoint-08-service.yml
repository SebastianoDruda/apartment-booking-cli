name: Checkpoint 08 · service pipeline

# Reusable pipeline of one service of releases/checkpoint-08-microservices. Each team calls it
# from its own workflow, which runs only when that team's code (or what it
# depends on) changes: its unit tests, its side of the event contract, lint, and
# the service's own Docker image.
on:
  workflow_call:
    inputs:
      service:
        description: 'apartment or reservation'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: releases/checkpoint-08-microservices/microservices

jobs:
  test:
    name: ${{ inputs.service }} · tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      PYTHONPATH: ..
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install service dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests of the service
        run: python -m unittest discover -s tests/unit -p "test_${{ inputs.service }}*.py" -v
      - name: Unit tests of the shared platform code
        run: python -m unittest discover -s tests/unit -p "test_common_*.py" -v
      - name: The service's side of the event contract
        run: python -m unittest discover -s tests/contract -p "test_${{ inputs.service }}_*.py" -v

  image:
    name: ${{ inputs.service }} · lint and image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Lint the service
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3
          python -m ruff check --isolated --select E4,E7,E9,F --target-version py310 dimora/${{ inputs.service }} dimora/common
      - name: Build the service image
        working-directory: releases/checkpoint-08-microservices
        run: >-
          docker build --file microservices/Dockerfile
          --target ${{ inputs.service }}-service
          --tag dimora-microservices-${{ inputs.service }}:${{ github.sha }} .
