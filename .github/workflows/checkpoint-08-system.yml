name: Checkpoint 08 · system

# The whole microservices stack of releases/checkpoint-08-microservices, whatever changed in it:
# every unit and contract test inside the image, the Docker stack with its
# resilience scenarios, and the Dimora end-to-end suite through the gateway.
# The stress test runs on demand (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'releases/checkpoint-08-microservices/**'
      - '.github/workflows/checkpoint-08-system.yml'
  pull_request:
    branches: [main]
    paths:
      - 'releases/checkpoint-08-microservices/**'
      - '.github/workflows/checkpoint-08-system.yml'
  workflow_dispatch:
    inputs:
      stress:
        description: 'Also run the stress test (about 4 minutes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checkpoint-08-system-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: releases/checkpoint-08-microservices

jobs:
  stack:
    name: Docker stack and resilience scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --file microservices/compose.yaml --profile tools config --quiet
      - name: Run every unit and contract test inside the image
        run: docker build --file microservices/Dockerfile --target test --tag dimora-microservices:test .
      - name: Exercise the stack (import, routing, outbox, late consumer, cascade, CLI, replicas)
        run: python3 microservices/tests/system/stack_smoke.py

  e2e:
    name: Dimora end-to-end through the gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: releases/checkpoint-08-microservices/website-studio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the microservices stack
        working-directory: releases/checkpoint-08-microservices/microservices
        run: docker compose up --build --detach --wait
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: releases/checkpoint-08-microservices/website-studio/package-lock.json
      - name: Install Playwright
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end suite against the gateway
        run: npx playwright test
        env:
          E2E_GATEWAY_URL: http://127.0.0.1:8080
      - name: Show service logs
        if: ${{ failure() }}
        working-directory: releases/checkpoint-08-microservices/microservices
        run: docker compose logs --no-color --tail 200
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-checkpoint-08
          path: |
            releases/checkpoint-08-microservices/website-studio/playwright-report/
            releases/checkpoint-08-microservices/website-studio/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: ${{ always() }}
        working-directory: releases/checkpoint-08-microservices/microservices
        run: docker compose down --volumes

  stress:
    name: Stress test with chaos
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stress }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 1,000 listings, 4,000 bookings, 90 s of mixed traffic with failures
        run: python3 microservices/tests/system/stack_stress.py --report stress-report.json
      - name: Upload the stress report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-report-checkpoint-08
          path: releases/checkpoint-08-microservices/stress-report.json
          if-no-files-found: warn
          retention-days: 14
