name: Checkpoint 07 · CQRS microservices

# The event-driven CQRS edition in releases/checkpoint-07-cqrs-microservices: unit tests, the full
# Docker stack with its resilience scenarios, and the Dimora end-to-end suite
# through the nginx gateway. The release carries its own copy of the domain
# package and the web client, so a change to either triggers it too.
on:
  push:
    branches: [main]
    paths:
      - 'releases/checkpoint-07-cqrs-microservices/**'
      - '.github/workflows/microservices.yml'
  pull_request:
    branches: [main]
    paths:
      - 'releases/checkpoint-07-cqrs-microservices/**'
      - '.github/workflows/microservices.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: releases/checkpoint-07-cqrs-microservices

concurrency:
  group: microservices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install service dependencies
        run: python -m pip install -r microservices/requirements.txt
      - name: Run unit tests
        working-directory: releases/checkpoint-07-cqrs-microservices/microservices
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests/unit -v

  stack:
    name: Docker stack and resilience scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --file microservices/compose.yaml config --quiet
      - name: Run unit tests inside the service image
        run: docker build --file microservices/Dockerfile --target test --tag dimora-events-service:test .
      - name: Exercise the stack (import, CQRS, outbox, late consumers, cascade, CLI, rebuild)
        run: python3 microservices/tests/system/stack_smoke.py

  e2e:
    name: Dimora end-to-end through the gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: releases/checkpoint-07-cqrs-microservices/website-studio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the event-driven stack
        working-directory: releases/checkpoint-07-cqrs-microservices/microservices
        run: docker compose up --build --detach --wait
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: releases/checkpoint-07-cqrs-microservices/website-studio/package-lock.json
      - name: Install Playwright
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end suite against the gateway
        run: npx playwright test
        env:
          E2E_GATEWAY_URL: http://127.0.0.1:8080
      - name: Show service logs
        if: ${{ failure() }}
        working-directory: releases/checkpoint-07-cqrs-microservices/microservices
        run: docker compose logs --no-color --tail 200
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-microservices
          path: |
            releases/checkpoint-07-cqrs-microservices/website-studio/playwright-report/
            releases/checkpoint-07-cqrs-microservices/website-studio/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: ${{ always() }}
        working-directory: releases/checkpoint-07-cqrs-microservices/microservices
        run: docker compose down --volumes
