name: Checkpoint 06 · Playwright

# End-to-end tests of the Dimora web client against the real Flask API.
# Runs on every change to checkpoint 06, because a backend change can break the
# user journeys too.
on:
  push:
    branches: [main]
    paths:
      - 'releases/checkpoint-06-dimora-web/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'releases/checkpoint-06-dimora-web/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Chromium desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: releases/checkpoint-06-dimora-web/website-studio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the API dependencies
        run: python -m pip install -r ../requirements/web.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: releases/checkpoint-06-dimora-web/website-studio/package-lock.json
      - name: Install Playwright
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end suite
        run: npx playwright test
        env:
          PYTHON: python
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            releases/checkpoint-06-dimora-web/website-studio/playwright-report/
            releases/checkpoint-06-dimora-web/website-studio/test-results/
          if-no-files-found: warn
          retention-days: 14
