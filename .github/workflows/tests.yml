name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and CLI integration tests
        run: |
          python -m pip install -r requirements/web.txt
          python -m unittest discover -s tests -v

  docker:
    name: Docker CLI and HTTP workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run tests inside the Python image
        run: docker build --target test --tag apartment-booking-cli:test .
      - name: Build runtime image
        run: docker compose build
      - name: Check CLI and data persistence across containers
        run: python3 tests/smoke/docker_cli.py
      - name: Check HTTP and shared CLI storage across web restarts
        run: python3 tests/smoke/docker_web.py

  playwright:
    name: Playwright Web UI E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements/web.txt
            requirements/e2e.txt
      - name: Install Flask and Playwright dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/web.txt -r requirements/e2e.txt
      - name: Install Playwright Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright Web UI End-to-End tests
        run: python -m unittest discover -s tests/e2e -p "test_*.py" -v
