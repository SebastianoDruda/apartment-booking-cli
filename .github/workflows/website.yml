name: Checkpoint 06 · Website

on:
  push:
    branches: [main]
    paths: ['releases/checkpoint-06-dimora-web/website-studio/**', '.github/workflows/website.yml']
  pull_request:
    branches: [main]
    paths: ['releases/checkpoint-06-dimora-web/website-studio/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Dimora web client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: releases/checkpoint-06-dimora-web/website-studio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check module syntax
        run: find public/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run client tests (i18n, rendering, formatting, services)
        run: node --test "tests/**/*.test.js"
      - name: Run development server tests
        run: python -m unittest discover -s tests -v
