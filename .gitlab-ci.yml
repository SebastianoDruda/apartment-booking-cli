# GitLab CI for the Apartment Booking System.
#
# Every release lives in releases/checkpoint-NN-<title>/ and is tested on its own.
# Jobs run on the project-scoped, self-managed runner described in ci/gitlab/:
# a Docker executor on Apple Silicon that accepts only jobs tagged local, docker
# and arm64, runs one unprivileged job at a time and never uses Docker-in-Docker,
# so the Docker stacks themselves are exercised on GitHub Actions.
#
# Reports are written to the project root, where pipeline-summary collects them.

stages:
  - validate
  - test
  - performance
  - report

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # Multi-architecture image indexes pinned by digest for reproducible jobs.
  PYTHON_310_IMAGE: "python:3.10-slim-bookworm@sha256:5be5aaecb962a41567bc8041f1e9e3432cb085b037fe057f9a562630b2e4b370"
  PYTHON_314_IMAGE: "python:3.14-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  PYTHONDONTWRITEBYTECODE: "1"
  CHECKPOINT_06: "releases/checkpoint-06-dimora-web"
  CHECKPOINT_07: "releases/checkpoint-07-cqrs-microservices"
  CHECKPOINT_08: "releases/checkpoint-08-microservices"

default:
  image: $PYTHON_314_IMAGE
  tags:
    - local
    - docker
    - arm64
  interruptible: true
  timeout: 10m

.ci-tools-cache:
  cache:
    key:
      files:
        - releases/checkpoint-06-dimora-web/requirements/ci.txt
    paths:
      - .cache/pip

lint:
  stage: validate
  extends: .ci-tools-cache
  script:
    - python -m pip install -r $CHECKPOINT_06/requirements/ci.txt
    # Lint arrived with checkpoint 04; 01-03 are kept exactly as they were released.
    # --isolated applies the same correctness rules everywhere, whatever local config exists.
    - >-
      python -m ruff check --isolated --select E4,E7,E9,F --target-version py310
      --exclude node_modules
      releases/checkpoint-04-github-actions releases/checkpoint-05-gitlab-ci
      $CHECKPOINT_06 $CHECKPOINT_07 $CHECKPOINT_08 run.py ci
    - python -m compileall -q releases run.py ci -x node_modules

# ---------------------------------------------------------------- checkpoints 01-05
checkpoints-01-05:
  stage: test
  extends: .ci-tools-cache
  script:
    - python -m pip install -r $CHECKPOINT_06/requirements/ci.txt -r $CHECKPOINT_06/requirements/web.txt
    - |
      for release in releases/checkpoint-0[1-5]-*; do
        echo "== $release"
        (cd "$release" && python -m pytest -q --junitxml="$CI_PROJECT_DIR/junit-$(basename "$release").xml")
      done
  artifacts:
    when: always
    name: "checkpoints-01-05-$CI_COMMIT_SHORT_SHA"
    paths:
      - junit-checkpoint-0*.xml
    reports:
      junit: junit-checkpoint-0*.xml
    expire_in: 14 days

# ---------------------------------------------------------------- checkpoint 06
.unit-tests:
  stage: test
  cache:
    key:
      files:
        - releases/checkpoint-06-dimora-web/requirements/web.txt
        - releases/checkpoint-06-dimora-web/requirements/ci.txt
    paths:
      - .cache/pip
  before_script:
    - python --version
    - python -m pip install -r $CHECKPOINT_06/requirements/web.txt -r $CHECKPOINT_06/requirements/ci.txt
    - cd $CHECKPOINT_06

unit-tests:python3.10:
  extends: .unit-tests
  image: $PYTHON_310_IMAGE
  script:
    - python -m pytest --junitxml=$CI_PROJECT_DIR/junit-py3.10.xml
  artifacts:
    when: always
    name: "unit-tests-py3.10-$CI_COMMIT_SHORT_SHA"
    paths:
      - junit-py3.10.xml
    reports:
      junit: junit-py3.10.xml
    expire_in: 14 days

unit-tests:python3.14:
  extends: .unit-tests
  image: $PYTHON_314_IMAGE
  script:
    - python -m coverage run -m pytest --junitxml=$CI_PROJECT_DIR/junit-py3.14.xml
    - python -m coverage xml -o $CI_PROJECT_DIR/coverage.xml
    - python -m coverage html -d $CI_PROJECT_DIR/htmlcov
    # Enforces the 85% branch-coverage minimum configured in the release's pyproject.toml.
    - python -m coverage report
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    name: "unit-tests-py3.14-$CI_COMMIT_SHORT_SHA"
    paths:
      - junit-py3.14.xml
      - coverage.xml
      - htmlcov/
    reports:
      junit: junit-py3.14.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 14 days

# ---------------------------------------------------------------- checkpoint 07
checkpoint-07-unit-tests:
  stage: test
  # Event contract, projector, outbox, HTTP services and the CLI's gateway client,
  # with in-memory fakes.
  cache:
    key:
      files:
        - releases/checkpoint-07-cqrs-microservices/microservices/requirements.txt
    paths:
      - .cache/pip
  script:
    - python -m pip install -r $CHECKPOINT_07/microservices/requirements.txt -r $CHECKPOINT_06/requirements/ci.txt
    - cd $CHECKPOINT_07/microservices
    - PYTHONPATH=.. python -m pytest tests/unit --junitxml=$CI_PROJECT_DIR/junit-checkpoint-07.xml
  artifacts:
    when: always
    name: "checkpoint-07-unit-tests-$CI_COMMIT_SHORT_SHA"
    paths:
      - junit-checkpoint-07.xml
    reports:
      junit: junit-checkpoint-07.xml
    expire_in: 14 days

# ---------------------------------------------------------------- checkpoint 08
# One job per team runs only when that team's code, or what it depends on,
# changes; the all-tests job always checks the whole release.
.checkpoint-08:
  stage: test
  cache:
    key:
      files:
        - releases/checkpoint-08-microservices/microservices/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install -r $CHECKPOINT_08/microservices/requirements.txt -r $CHECKPOINT_06/requirements/ci.txt
    - cd $CHECKPOINT_08/microservices
    - export PYTHONPATH=..
  artifacts:
    when: always
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - junit-checkpoint-08-*.xml
    reports:
      junit: junit-checkpoint-08-*.xml
    expire_in: 14 days

checkpoint-08:apartment-service:
  extends: .checkpoint-08
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - releases/checkpoint-08-microservices/microservices/dimora/apartment/**/*
        - releases/checkpoint-08-microservices/microservices/dimora/common/**/*
        - releases/checkpoint-08-microservices/microservices/contracts/**/*
        - releases/checkpoint-08-microservices/microservices/tests/unit/test_apartment*
        - releases/checkpoint-08-microservices/microservices/tests/contract/test_apartment*
        - releases/checkpoint-08-microservices/apartment_booking/**/*
        - .gitlab-ci.yml
  script:
    - >-
      python -m pytest tests/unit/test_apartment_service.py tests/unit/test_common_*.py
      tests/contract/test_apartment_producer.py
      --junitxml=$CI_PROJECT_DIR/junit-checkpoint-08-apartment.xml

checkpoint-08:reservation-service:
  extends: .checkpoint-08
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - releases/checkpoint-08-microservices/microservices/dimora/reservation/**/*
        - releases/checkpoint-08-microservices/microservices/dimora/common/**/*
        - releases/checkpoint-08-microservices/microservices/contracts/**/*
        - releases/checkpoint-08-microservices/microservices/tests/unit/test_reservation*
        - releases/checkpoint-08-microservices/microservices/tests/contract/test_reservation*
        - releases/checkpoint-08-microservices/apartment_booking/**/*
        - .gitlab-ci.yml
  script:
    - >-
      python -m pytest tests/unit/test_reservation_service.py tests/unit/test_common_*.py
      tests/contract/test_reservation_consumer.py
      --junitxml=$CI_PROJECT_DIR/junit-checkpoint-08-reservation.xml

checkpoint-08:all-tests:
  extends: .checkpoint-08
  script:
    - python -m pytest tests/unit tests/contract --junitxml=$CI_PROJECT_DIR/junit-checkpoint-08-all.xml

# ---------------------------------------------------------------- performance (checkpoint 06)
load-test:
  stage: performance
  variables:
    # Disposable database inside the job container; never shared with other jobs.
    APARTMENT_BOOKING_DB_PATH: /tmp/apartment-booking-load-test.db
  cache:
    key:
      files:
        - releases/checkpoint-06-dimora-web/requirements/web.txt
        - releases/checkpoint-06-dimora-web/requirements/load.txt
    paths:
      - .cache/pip
  script:
    - python -m pip install -r $CHECKPOINT_06/requirements/web.txt -r $CHECKPOINT_06/requirements/load.txt
    - mkdir -p .artifacts/locust
    - cd $CHECKPOINT_06
    - >-
      python -m flask --app apartment_booking.web:create_app --no-debug run
      --host 127.0.0.1 --port 8000 --no-debugger --no-reload
      > $CI_PROJECT_DIR/.artifacts/locust/flask.log 2>&1 &
    - |
      for attempt in $(seq 1 30); do
        if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()" 2>/dev/null; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "The API did not become healthy within 30 seconds." >&2
          cat $CI_PROJECT_DIR/.artifacts/locust/flask.log >&2
          exit 1
        fi
        sleep 1
      done
    # Same journey, load and service-level objectives as the GitHub workflow.
    - >-
      python -m locust
      --locustfile tests/performance/locustfile.py
      --host http://127.0.0.1:8000
      --headless --users 10 --spawn-rate 2 --run-time 30s --stop-timeout 5
      --only-summary
      --csv $CI_PROJECT_DIR/.artifacts/locust/results --csv-full-history
      --html $CI_PROJECT_DIR/.artifacts/locust/report.html
      --logfile $CI_PROJECT_DIR/.artifacts/locust/locust.log
  artifacts:
    when: always
    name: "load-test-$CI_COMMIT_SHORT_SHA"
    paths:
      - .artifacts/locust/
    expire_in: 14 days

pipeline-summary:
  stage: report
  needs:
    - job: unit-tests:python3.10
      artifacts: true
    - job: unit-tests:python3.14
      artifacts: true
    - job: load-test
      artifacts: true
  script:
    - python ci/gitlab/summarize_reports.py
  artifacts:
    name: "pipeline-summary-$CI_COMMIT_SHORT_SHA"
    paths:
      - pipeline-summary.md
    expire_in: 14 days
