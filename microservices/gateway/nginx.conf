# Dimora gateway: one entry point for the browser and the CLI.
#
#   /            the Dimora web client (static files)
#   /api/*       GET               -> query service (read model)
#                POST/PATCH/DELETE -> apartment or reservation service (write models)
#   /docs        the API explorer, served by the query service
#
# The URLs are the same as in the original edition, so clients do not change.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # The container runs as the unprivileged nginx user with a read-only root file system.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format gateway '$remote_addr "$request_method $uri" $status '
                       'upstream=$upstream_addr time=${request_time}s';
    access_log /dev/stdout gateway;

    upstream apartment_service   { server apartment-service:8000;   keepalive 8; }
    upstream reservation_service { server reservation-service:8000; keepalive 8; }
    upstream query_service       { server query-service:8000;       keepalive 8; }

    # CQRS routing: writes go to the service that owns the data, reads to the query service.
    map "$request_method $uri" $api_backend {
        default                                           query_service;
        "~^(POST|PUT|PATCH|DELETE) /api/apartments(/|$)"  apartment_service;
        "~^(POST|PUT|PATCH|DELETE) /api/bookings(/|$)"    reservation_service;
    }

    server {
        listen 8080;
        client_max_body_size 64k;

        location /api {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 15s;
            # Shows which service answered; useful when demonstrating the routing.
            add_header X-Served-By $api_backend always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /docs {
            proxy_pass http://query_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /static/ {
            proxy_pass http://query_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cache-Control no-cache always;
        }
    }
}
