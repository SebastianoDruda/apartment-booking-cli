[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-booking-cli"
version = "1.0.0"
description = "Offline terminal apartment and reservation manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.9,<15"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apartment_booking = ["storage/schema.sql"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["apartment_booking"]

[tool.coverage.report]
show_missing = true
fail_under = 80
