# Tool configuration shared by local runs, GitHub Actions and GitLab CI.
# The application runs from source and is not packaged; dependencies live in requirements/.

[tool.coverage.run]
branch = true
source = ["apartment_booking"]

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness rules: syntax errors, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]
