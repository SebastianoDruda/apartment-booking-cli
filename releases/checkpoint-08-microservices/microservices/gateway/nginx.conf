# Dimora gateway: one entry point for the browser and the CLI.
#
#   /                    the Dimora web client (static files)
#   /api/apartments      every method -> apartment service (owns apartments)
#   /api/bookings        every method -> reservation service (owns bookings)
#   /api/availability    GET          -> reservation service (bookings + apartment copy)
#   /api, /docs, ...     health, overview, OpenAPI and the explorer -> apartment service
#
# Routing is by path: each resource goes to the service that owns its data, for
# reads and writes alike. The URLs are the same as in the original edition, so
# clients do not change.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # The container runs as the unprivileged nginx user with a read-only root file system.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format gateway '$remote_addr "$request_method $uri" $status '
                       'upstream=$upstream_addr time=${request_time}s';
    access_log /dev/stdout gateway;

    # Docker's DNS answers with every replica of a service. nginx asks again every
    # 5 s, so scaling a service or restarting it with a new address needs no gateway
    # restart. Requests are spread over the replicas, and a request that cannot be
    # delivered to one (it is stopping and refuses connections) moves to the next:
    # POSTs too, because nothing was sent yet. No idle connections are kept to the
    # services, so a stopping replica receives nothing new while it finishes its
    # in-flight requests (see GracefulShutdown in dimora/common/http.py).
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream apartment_service {
        zone apartment_service 64k;
        server apartment-service:8000 resolve;
    }
    upstream reservation_service {
        zone reservation_service 64k;
        server reservation-service:8000 resolve;
    }

    # Ownership routing: a resource goes to the service that owns its data.
    map $uri $api_backend {
        default                          apartment_service;
        "~^/api/bookings(/|$)"           reservation_service;
        "~^/api/availability(/|$)"       reservation_service;
    }

    server {
        listen 8080;
        client_max_body_size 64k;

        location /api {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            # Shows which service answered; useful when demonstrating the routing.
            add_header X-Served-By $api_backend always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /docs {
            proxy_pass http://apartment_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /static/ {
            proxy_pass http://apartment_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cache-Control no-cache always;
        }
    }
}
